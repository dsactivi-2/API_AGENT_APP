name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Syntax prüfen
        run: |
          python -m compileall -q app launcher.py tools
          bash -n install.sh

      - name: End-to-End-Test (ohne echte API-Aufrufe)
        run: python tests/test_e2e.py
